images:
- location: "https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-arm64-20260712-2537.qcow2"
  arch: "aarch64"
  digest: "sha512:8543d795f2fde630eb66c492f245a8c1da19dedc636e0a8e7b3d0f95920e1a05aa911ef2d82d177d41cc53ced5fccbd2a3945d07fa5e15018914c4d864bb07ed"
  variant: "genericcloud"

vmType: "vz"

cpus: 10
memory: 16GiB
disk: 100GiB

networks:
- vzNAT: true

ssh:
  loadDotSSHPubKeys: true
  overVsock: false

portForwards:
  - guestIP: 0.0.0.0
    proto: any
    ignore: true
  - guestIP: 127.0.0.1
    proto: any
    ignore: true

containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    #!/bin/sh
    mkdir -p /etc/cloud/cloud.cfg.d
    echo "ssh_deletekeys: false" > /etc/cloud/cloud.cfg.d/lima-local.cfg
