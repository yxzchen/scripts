images:
- location: "https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-arm64-20260712-2537.qcow2"
  arch: "aarch64"
  digest: "sha512:8543d795f2fde630eb66c492f245a8c1da19dedc636e0a8e7b3d0f95920e1a05aa911ef2d82d177d41cc53ced5fccbd2a3945d07fa5e15018914c4d864bb07ed"
  variant: "genericcloud"

vmType: "vz"
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

cpus: 10
memory: 16GiB
disk: 100GiB

networks:
- vzNAT: true

ssh:
  loadDotSSHPubKeys: true
  overVsock: false

portForwards:
  - guestIP: 0.0.0.0
    proto: any
    ignore: true
  - guestIP: 127.0.0.1
    proto: any
    ignore: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu

      mkdir -p /etc/cloud/cloud.cfg.d
      echo "ssh_deletekeys: false" > /etc/cloud/cloud.cfg.d/lima-local.cfg

      conf=/usr/lib/binfmt.d/rosetta.conf
      override=/etc/binfmt.d/rosetta.conf
      entry=/proc/sys/fs/binfmt_misc/rosetta

      [ -x /mnt/lima-rosetta/rosetta ] || exit 0
      [ -f "$conf" ] || exit 0

      mkdir -p /etc/binfmt.d

      if [ ! -f "$override" ] || ! grep -q ':POCF$' "$override"; then
          sed 's/:OCF$/:POCF/' "$conf" > "$override"
      fi

      if ! grep -q '^flags:.*P' "$entry" 2>/dev/null; then
          systemctl restart systemd-binfmt.service
      fi
